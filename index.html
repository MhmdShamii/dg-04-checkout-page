<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>checkout page</title>
    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <i class="fa-solid fa-arrow-left"></i>
      <div>
        <h2>Order Checkout</h2>
        <p>step 2 of 2 Fast & Secure</p>
      </div>
    </header>
    <section class="container">
      <section class="orders">
        <div class="order-items">
          <div class="items-header"></div>
        </div>
      </section>
      <section class="delivery-info">
        <div class="delivery-header">
          <img src="./imgs/image.png" alt="" width="38" height="37" />
          <div>
            <h3>Delivery Information</h3>
            <p>Where should we deliver your order?</p>
          </div>
        </div>
        <form class="delivery-form" id="delivery-form" method="post">
          <div class="field">
            <label for="full-name"
              >Full Name
              <span class="required-mark" aria-hidden="true">*</span></label
            >
            <input
              type="text"
              id="full-name"
              name="full_name"
              placeholder="Sarah Jenkins"
              autocomplete="name"
              aria-describedby="full-name-error"
              required
            />
            <p class="error-msg" id="full-name-error" hidden></p>
          </div>
          <div class="contact-info">
            <div class="field">
              <label for="email"
                >Email Address
                <span class="required-mark" aria-hidden="true">*</span></label
              >
              <input
                type="email"
                id="email"
                name="email"
                placeholder="sarah@example.com"
                autocomplete="email"
                autocapitalize="off"
                spellcheck="false"
                aria-describedby="email-error"
                required
              />
              <p class="error-msg" id="email-error" hidden></p>
            </div>
            <div class="field">
              <label for="phone"
                >Phone Number
                <span class="required-mark" aria-hidden="true">*</span></label
              >
              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="(555) 234-5678"
                autocomplete="tel"
                pattern="[0-9+\(\) \-]{7,20}"
                aria-describedby="phone-error"
                required
              />
              <p class="error-msg" id="phone-error" hidden></p>
            </div>
          </div>
          <div class="field">
            <label for="street-address"
              >Street Address
              <span class="required-mark" aria-hidden="true">*</span></label
            >
            <input
              type="text"
              id="street-address"
              name="street_address"
              placeholder="742 Evergreen Terrace, Apt 4B"
              autocomplete="street-address"
              aria-describedby="street-address-error"
              required
            />
            <p class="error-msg" id="street-address-error" hidden></p>
          </div>
        </form>
        <p class="form-status" id="form-status" role="status" hidden></p>
      </section>
      <section class="delivery-method">
        <div class="delivery-header">
          <span class="method-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" />
              <path d="M15 18H9" />
              <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" />
              <circle cx="17" cy="18" r="2" />
              <circle cx="7" cy="18" r="2" />
            </svg>
          </span>
          <div>
            <h3 id="delivery-method-title">Delivery Method</h3>
            <p>Choose your shipping speed</p>
          </div>
        </div>
        <fieldset class="method-options" aria-labelledby="delivery-method-title">
          <label class="method-option">
            <input
              type="radio"
              name="delivery_method"
              value="standard"
              data-fee="5"
              form="delivery-form"
              checked
              required
            />
            <span class="method-top">
              <span class="method-name">Standard</span>
              <span class="method-price">$5.00</span>
            </span>
            <span class="method-time">3 - 5 business days</span>
            <span class="method-tag method-tag-green">Economical</span>
          </label>
          <label class="method-option">
            <input
              type="radio"
              name="delivery_method"
              value="express"
              data-fee="10"
              form="delivery-form"
            />
            <span class="method-top">
              <span class="method-name">Express</span>
              <span class="method-price">$10.00</span>
            </span>
            <span class="method-time">1 - 2 business days</span>
            <span class="method-tag method-tag-indigo">Priority Carrier</span>
          </label>
        </fieldset>
      </section>
      <section class="promo-code">
        <div class="promo-header">
          <label class="promo-title" for="promo-code">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z" />
              <circle cx="7.5" cy="7.5" r=".5" fill="currentColor" />
            </svg>
            Have a Promo Code?
          </label>
          <span class="promo-hint">Use: SAVE10</span>
        </div>
        <form class="promo-row" id="promo-form">
          <div class="field">
            <input
              type="text"
              id="promo-code"
              name="promo_code"
              placeholder="Enter coupon code"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              aria-describedby="promo-message"
            />
          </div>
          <button class="promo-apply" type="submit">Apply</button>
        </form>
        <p class="form-status" id="promo-message" role="status" hidden></p>
      </section>
      <section class="payment-breakdown">
        <h3>Payment Breakdown</h3>
        <dl>
          <div class="breakdown-row">
            <dt id="breakdown-subtotal-label">Subtotal</dt>
            <dd id="breakdown-subtotal"></dd>
          </div>
          <div class="breakdown-row" id="breakdown-discount-row" hidden>
            <dt id="breakdown-discount-label">Discount</dt>
            <dd id="breakdown-discount" class="breakdown-discount"></dd>
          </div>
          <div class="breakdown-row">
            <dt id="breakdown-fee-label">Delivery Fee</dt>
            <dd id="breakdown-fee"></dd>
          </div>
          <div class="breakdown-total">
            <dt>Total Amount</dt>
            <dd id="breakdown-total"></dd>
          </div>
        </dl>
        <p class="breakdown-note">Includes all applicable taxes</p>
      </section>
    </section>
    <footer class="checkout-bar">
      <div class="checkout-total">
        <span class="checkout-total-label">Final Total</span>
        <strong class="checkout-total-amount" aria-live="polite">$0.00</strong>
      </div>
      <button class="place-order" type="submit" form="delivery-form">
        Place Order
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 12h16M14 6l6 6-6 6" />
        </svg>
      </button>
    </footer>
  </body>
</html>
