<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <i class="fa-solid fa-arrow-left"></i>
        <div>
            <h2>Order Checkout</h2>
            <p>step 2 of 2 Fast & Secure</p>
        </div>
    </header>
    <section class="container">
        <section class="delivery-info">
            <div class="delivery-header">
                <img src="./imgs/image.png" alt="" width="38" height="37">
                <div>
                    <h3>Delivery Information</h3>
                    <p>Where should we deliver your order?</p>
                </div>
            </div>
            <form class="delivery-form">
                <div class="field">
                    <label for="full-name">Full Name <span class="required-mark" aria-hidden="true">*</span></label>
                    <input type="text" id="full-name" name="full_name" placeholder="Sarah Jenkins" autocomplete="name" required>
                </div>
                <div class="contact-info">
                    <div class="field">
                        <label for="email">Email Address <span class="required-mark" aria-hidden="true">*</span></label>
                        <input type="email" id="email" name="email" placeholder="sarah@example.com" autocomplete="email" autocapitalize="off" spellcheck="false" required>
                    </div>
                    <div class="field">
                        <label for="phone">Phone Number <span class="required-mark" aria-hidden="true">*</span></label>
                        <input type="tel" id="phone" name="phone" placeholder="(555) 234-5678" autocomplete="tel" required>
                    </div>
                </div>
                <div class="field">
                    <label for="street-address">Street Address <span class="required-mark" aria-hidden="true">*</span></label>
                    <input type="text" id="street-address" name="street_address" placeholder="742 Evergreen Terrace, Apt 4B" autocomplete="street-address" required>
                </div>
            </form>
        </section>
    </section>
</body>
</html>
